# 前端 CI 门禁（review L10）：类型检查 + 单测 + 构建产物验证。
# frontend 为独立仓库（pnpm workspace root），与后端 CI（backend/.github/workflows/ci.yml）互不阻塞。
name: Frontend CI

on:
  push:
    branches: [master]
  pull_request:

# 重复 push 自动取消在跑 job（省 CI 分钟，与后端一致）
concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: 门禁（类型检查 + vitest + 构建）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.6.5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      - name: 类型检查 + 单测（41 用例基线，见 frontend/README.md）
        run: pnpm test
      - name: 构建（vue-tsc -b 类型门禁 + vite build 产物验证）
        run: pnpm build