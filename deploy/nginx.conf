# 前端站点配置：静态资源 + SPA 回退 + 后端同源反代。
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # why：Docker 内置 DNS（127.0.0.11）+ 变量式 proxy_pass，使上游地址在每次请求时重新解析。
    # 若直接写 `proxy_pass http://api:8000`，nginx 只在**启动时**解析一次并永久缓存 IP；
    # api 容器重建（docker compose up --build 会换 IP）后，nginx 仍打旧 IP → 502 Bad Gateway。
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;

    # why：Vue Router history 模式下直接刷新 /cases 这类路径，服务端无对应文件，必须回退 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带 hash 的构建产物可长期缓存（文件名变即失效）
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # why：与 dev 的 Vite 代理保持一致——/api 与 /docs 同源转发到后端，规避空 CORS 白名单
    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 报告下载与 AI 生成可能耗时较长，放宽读超时
        proxy_read_timeout 600s;
    }

    location /docs {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /openapi.json {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
    }

    location /health {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
    }
}
